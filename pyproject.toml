[project]
name = "python-dsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bnaveeng9", email = "naveeng9@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "mangum>=0.22.0",
    "mcp>=2.3.0",
    "names>=0.3.0",
    "pydantic>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
python-dsa = "python_dsa:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
